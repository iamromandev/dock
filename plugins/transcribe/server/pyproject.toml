[project]
name = "dock-transcribe-server"
version = "0.0.0"
requires-python = "==3.15.2"
dependencies = ["mlx-whisper==0.4.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "ty==0.0.86", "numpy==2.5.5"]

[tool.uv]
package = false
# mlx needs Metal, and its linux CUDA wheels do not exist for 3.15
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
