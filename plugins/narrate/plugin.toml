id = "dev.dock.narrate"
version = "0.1.0"
api_version = "2"
description = "Read a text or Markdown file aloud into a WAV file with a local Kokoro server"

[run]
container = { cmd = "python3", args = ["/plugin/main.py"] }

[capabilities]
permissions = ["network", "fs:read:in", "fs:write:cwd"]
env = ["DOCK_NARRATE_URL", "DOCK_NARRATE_MODEL"]

[[commands]]
name = "narrate"
summary = "Read a text or Markdown file aloud into a WAV file in the current folder (speech, audio, narration): narrate <file> [--voice af_heart|af_bella|am_michael|am_fenrir] [--speed 0.5-2.0] [-o name.wav]"
keywords = ["narrate", "speech", "audio", "read aloud", "tts", "voice"]
inputs = [
  { name = "file", type = "string", required = true },
  { name = "voice", type = "string", flag = "--voice" },
  { name = "speed", type = "string", flag = "--speed" },
  { name = "output", type = "string", flag = "--output", short = "-o" },
]
