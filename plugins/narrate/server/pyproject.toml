[project]
name = "dock-narrate-server"
version = "0.0.0"
requires-python = "==3.15.2"
dependencies = [
    "mlx-audio==0.6.8",
    "misaki[en]==0.9.4",
    # spaCy would pip-install this at runtime when missing; pin it instead
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "ty==0.0.86", "numpy==2.5.5"]

[tool.uv]
package = false
# mlx needs Metal, and its linux CUDA wheels do not exist for 3.15
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
