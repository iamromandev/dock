[project]
name = "dock"
version = "0.1.0"
description = "A tiny CLI host where every feature is an out-of-process, any-language plugin"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dock = "dock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dock"]

[tool.ruff]
line-length = 110
