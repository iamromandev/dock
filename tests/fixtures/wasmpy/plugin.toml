id = "dev.dock.wasmpy"
version = "0.1.0"
api_version = "1"
description = "Test fixture: a single-threaded Python plugin on the WASI interpreter; reports what it can reach"

# No permissions on purpose: under WASM it gets no cwd and no network.
# It declares one variable, so tests can tell a declared host variable from an undeclared one.
[run]
wasm = { python = "3.15", script = "main.py" }

[[commands]]
name = "greet"
summary = "greet [name]: print a greeting"

[[commands]]
name = "count"
summary = "Print how many times this process was asked to count (shows a warm process is reused)"

[[commands]]
name = "writedata"
summary = "writedata <text>: write it to a file in the data dir, read it back and print it"

[[commands]]
name = "readcwd"
summary = "readcwd <name>: print the text of a file in the user's cwd, or unreadable"

[[commands]]
name = "writecwd"
summary = "writecwd <name>: create a file in the user's cwd; prints written or denied"

[[commands]]
name = "env"
summary = "env <NAME>: print set:<value> or unset"

[[commands]]
name = "net"
summary = "Try to open a socket and connect out; prints blocked or open"

[[commands]]
name = "readhome"
summary = "readhome <path>: print the text of a host file by absolute path, or unreadable"

[[commands]]
name = "writeplugin"
summary = "Try to write into the plugin folder; prints denied or written"

[[commands]]
name = "writepython"
summary = "Try to write into the interpreter folder; prints denied or written"

[capabilities]
env = ["DOCK_WASMPY_DECLARED"]
