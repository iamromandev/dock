id = "dev.dock.wasmmod"
version = "0.1.0"
api_version = "1"
description = "Test fixture: runs under the (fake) WASM runner; plugin.wasm is a Python file for the fake wasmtime"

[run]
# Neither of these may ever be used: wasm wins, with or without [isolation].
any = { cmd = "python3", args = ["-c", "import sys; sys.exit(99)"] }
container = { cmd = "python3", args = ["-c", "import sys; sys.exit(98)"] }
wasm = { module = "plugin.wasm", args = ["--flag"] }

[[commands]]
name = "code"
summary = "Return exit code n: code <n>"

[[commands]]
name = "crash"
summary = "Exit the process mid-invoke"

[[commands]]
name = "pid"
summary = "Write pid to data_dir/pid and print it"

[[commands]]
name = "stubborn"
summary = "Sleep s seconds, never notices cancel: stubborn <s>"

[[commands]]
name = "env"
summary = "Print an environment variable as the plugin sees it: env <NAME>"

[[commands]]
name = "argv"
summary = "Print the process arguments after the module"

[[commands]]
name = "typed"
summary = "typed <word> [--times n]"
inputs = [
  { name = "word",  type = "string", required = true },
  { name = "times", type = "int",    flag = "--times", default = 1 },
]

[capabilities]
env = ["MY_VAR"]
