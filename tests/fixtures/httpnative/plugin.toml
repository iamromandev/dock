id = "dev.dock.httpnative"
version = "0.1.0"
api_version = "1"
description = "Test fixture: a native Python plugin that fetches through dock's http request"

# Declares no hosts: tests append a [capabilities] table with the entries (their ports are random).
[run]
any = { cmd = "python3", args = ["main.py"], requires = ["python3"] }

[[commands]]
name = "fetch"
summary = "fetch <url> [--method M] [--body TEXT] [--header 'Name: value'] [--digest]: print the status and body"
inputs = [
  { name = "url",    type = "string", required = true },
  { name = "method", type = "string", flag = "--method", default = "GET" },
  { name = "body",   type = "string", flag = "--body" },
  { name = "header", type = "string", flag = "--header" },
  { name = "digest", type = "bool",   flag = "--digest" },
]

[[commands]]
name = "fetch2"
summary = "fetch2 <first> <second> [--sequential]: send two requests at once, or one after the other, and print each outcome"
inputs = [
  { name = "first",  type = "string", required = true },
  { name = "second", type = "string", required = true },
  { name = "sequential", type = "bool", flag = "--sequential" },
]

[[commands]]
name = "fetch_deaf"
summary = "fetch_deaf <url>: send one request, then never read stdin again (a stuck plugin)"
inputs = [
  { name = "url", type = "string", required = true },
]
