[project]
name = "dock-host"
version = "0.2.0"
description = "The dock host core: plugin manifests, isolation, lifecycle, store, catalog and flows, independent of any terminal"
requires-python = "==3.15.2"
dependencies = []

[dependency-groups]
dev = ["coverage==7.17.5", "pytest==9.1.1", "ruff==0.17.0", "ty==0.0.86"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dock_host"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]

# The code base is untyped and relies on Optional attributes narrowed at runtime (see apps/cli/pyproject.toml).
[tool.ty.rules]
deprecated = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.coverage.run]
source = ["dock_host"]
patch = ["subprocess"]
parallel = true
dynamic_context = "test_function"
data_file = ".coverage"

[tool.coverage.json]
show_contexts = true

[tool.ty.environment]
extra-paths = ["tests"]

# These fire only in tests (fakes, partial constructors, sys.path set up by the tests).
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"        # test fakes assigned over callables
invalid-assignment = "ignore"       # fake processes assigned into typed registries
missing-argument = "ignore"         # tests construct objects with partial arguments on purpose
possibly-missing-submodule = "ignore"  # submodules imported elsewhere in the tests
