# The hooks run moon's cli:check and dm:check, so the checks and tool versions (apps/cli/uv.lock, plugins/dm/uv.lock,
# .prototools) live in one place.
# Install once from the repository root:
#     make install-hooks

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      # ruff check --fix, then ty, over apps/cli and plugins/hello. A fix fails the commit so the fixed files can be staged.
      - id: cli-check
        name: cli check (ruff --fix, ty)
        entry: moon run cli:check
        language: system
        pass_filenames: false
        files: ^(apps/cli|plugins/hello)/.*\.py$
      # Same for the dm plugin (plugins/dm).
      - id: dm-check
        name: dm check (ruff --fix, ty)
        entry: moon run dm:check
        language: system
        pass_filenames: false
        files: ^plugins/dm/.*\.py$
