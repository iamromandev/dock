[project]
name = "dock-cli"
version = "0.2.0"
description = "A tiny CLI host where every feature is an out-of-process, any-language plugin"
requires-python = "==3.15.2"
dependencies = []

[project.scripts]
dock = "src.main:main"

[dependency-groups]
dev = ["coverage==7.17.5", "pytest==9.1.1", "ruff==0.17.0", "ty==0.0.86"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Meant to be run from this checkout with uv, not published or installed as a wheel: the
# wheel would ship a top-level `src` package without plugins/ or docs/.
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "../../plugins/dm/tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]
parallel = true
dynamic_context = "test_function"
data_file = ".coverage"

[tool.coverage.json]
show_contexts = true

[tool.ty.environment]
extra-paths = ["tests", "../../plugins/dm", "../../plugins/dm/tests"]

# The code base is untyped and relies on Optional attributes narrowed at runtime, so these rules
# fire on correct code in src/ and plugins/. Counts are the diagnostics each one hides there.
[tool.ty.rules]
deprecated = "ignore"               # src 2: os.path.commonprefix / @contextmanager annotations
invalid-argument-type = "ignore"    # src 5, plugins 5: Optional values narrowed by runtime state
invalid-assignment = "ignore"       # plugins 2: untyped dict/attribute shapes
no-matching-overload = "ignore"     # src 3: subprocess calls with Optional/union args
not-iterable = "ignore"             # plugins 1: Optional iterables narrowed at runtime
too-many-positional-arguments = "ignore"  # plugins 2: callbacks invoked with extra positional args
unresolved-attribute = "ignore"     # src 22, plugins 19: Optional attributes (termios, Picker, ...)
unsupported-operator = "ignore"     # src 3, plugins 2: Optional numbers narrowed at runtime

# These fire only in tests (fakes, partial constructors, sys.path set up by the tests).
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"        # test fakes assigned over callables
invalid-method-override = "ignore"  # log_message overrides in test HTTP servers
missing-argument = "ignore"         # tests construct objects with partial arguments on purpose
possibly-missing-submodule = "ignore"  # submodules imported elsewhere in the tests
unresolved-import = "ignore"        # fixture modules (dht, server) are put on sys.path by the tests
