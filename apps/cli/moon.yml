id: "cli"
language: "python"
layer: "application"
tags: ["host"]

fileGroups:
  sources: ["src/**/*"]
  configs: ["pyproject.toml", "uv.lock", "ruff.toml"]
  # The plugins live at the repo root. dm and brain are their own
  # projects. The tests build the plugins' images, so `test` still takes all of plugins/ as input.
  plugins: ["/plugins/**/*"]

tasks:
  # python tools (uv)
  sync:
    # The dependencies into apps/cli/.venv
    command: "uv sync"
    preset: "utility"
  install:
    # Puts `dock` on your PATH: an editable uv tool install of this checkout, so `git pull` upgrades it.
    command: "uv tool install --editable --force ."
    options:
      cache: false
  uninstall:
    script: "uv tool uninstall dock-cli || true"
    options:
      cache: false
  check:
    # Fixes what ruff can, so it edits sources and is never cached.
    script: "uv run ruff check --fix . && uv run ty check ."
    deps: ["sync"]
    options:
      cache: false
  check-ci:
    # Same checks without fixing anything. For CI.
    script: "uv run ruff check . && uv run ty check ."
    deps: ["sync"]
    # ty resolves the CLI tests' imports through plugins/dm and its tests (pyproject extra-paths), so dm is an input.
    inputs: ["@group(sources)", "@group(configs)", "@group(plugins)", "tests/**/*"]
  test:
    # Needs Docker or podman, and stops at once without one. The images are built from plugins/ and
    # tests/fixtures/, both inputs, so a cached pass is never for a stale image.
    script: "uv run python -c \"import sys; sys.excepthook = lambda t, e, tb: print('moon: ' + str(e), file=sys.stderr); sys.path.insert(0, 'tests'); import dockenv; dockenv.require_runtime()\" && uv run pytest"
    deps: ["sync"]
    inputs: ["@group(sources)", "@group(configs)", "@group(plugins)", "tests/**/*", "$DOCK_TEST_RUNTIME", "$DOCK_LIVE_DHT"]

  coverage:
    # The test task under coverage (subprocesses included) with per-test contexts; writes coverage.json and coverage.txt.
    script: "uv run python -c \"import sys; sys.excepthook = lambda t, e, tb: print('moon: ' + str(e), file=sys.stderr); sys.path.insert(0, 'tests'); import dockenv; dockenv.require_runtime()\" && uv run coverage erase && uv run coverage run -m pytest -q && uv run coverage combine && uv run coverage json -o coverage.json && uv run coverage report > coverage.txt"
    deps: ["sync"]
    options:
      cache: false

  # run: arguments after -- go to dock, e.g. moon run cli:run -- plugin list
  run:
    command: "uv run dock"
    options:
      cache: false
      interactive: true

  # cleanup
  clean:
    script: "find . -name __pycache__ -type d -prune -exec rm -r {} + && rm -rf .pytest_cache .ruff_cache"
    preset: "utility"
