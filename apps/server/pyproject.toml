[project]
name = "dock-server"
version = "0.1.0"
description = "A localhost WebSocket host that runs one installed plugin command per connection"
requires-python = "==3.15.2"
dependencies = ["dock-host", "websockets==17.4"]

[project.scripts]
dock-server = "src.main:main"

[dependency-groups]
dev = ["coverage==7.17.5", "pytest==9.1.1", "ruff==0.17.0", "ty==0.0.86"]

[tool.uv.sources]
dock-host = { path = "../../packages/host", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ty.environment]
extra-paths = ["tests"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"        # fixture modules are put on sys.path by the tests
missing-argument = "ignore"         # tests construct objects with partial arguments on purpose
