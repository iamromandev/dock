# Lints, type-checks and tests the plugin kit (packages/plugin-kit/) and checks that every plugin's vendored copy of
# dock_plugin matches it, on every push and pull request to dev and main that touches the kit or a plugin. The steps
# call uv and python directly, the same commands as packages/plugin-kit/moon.yml's check-ci and test.
name: plugin-kit

on:
  push:
    branches: [dev, main]
    paths: ["packages/plugin-kit/**", "plugins/**", ".github/workflows/plugin-kit.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["packages/plugin-kit/**", "plugins/**", ".github/workflows/plugin-kit.yml"]

permissions:
  contents: read

jobs:
  plugin-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/plugin-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv installs Python 3.15.2 from packages/plugin-kit/.python-version. Same uv as .prototools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: false
      # --locked fails the job when uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest
      # Every plugin listed in plugins.txt must carry a byte-identical copy of dock_plugin/.
      - run: python3 -I tools/vendor.py check
