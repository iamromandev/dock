name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # wasmtime v50.0.2 for the runner's OS and architecture (ubuntu-latest is x86_64, macos-latest is
          # arm64). The digests are the release API's `digest` of each asset; the job fails on a mismatch.
          - os: ubuntu-latest
            wasmtime_target: x86_64-linux
            wasmtime_sha256: 5db0ca8e838ab95a51ba9acdf11f42888bcd0092dda45a86129ae540c4fa952c
          - os: macos-latest
            wasmtime_target: aarch64-macos
            wasmtime_sha256: 42b066764fb5ccd92f4378375202627b457be8ef0e85806784304ce9b07a721a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          # Recent macOS dyld rejects binaries without LC_UUID, which Go 1.22.x
          # does not emit; build with current stable Go.
          go-version: stable
          cache-dependency-path: plugin/download/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v50.0.2
        run: |
          set -euo pipefail
          asset="wasmtime-${WASMTIME_VERSION}-${{ matrix.wasmtime_target }}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/$asset"
          echo "${{ matrix.wasmtime_sha256 }}  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/wasmtime"
          tar -xJf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/wasmtime"
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"
      - name: Cache the pinned WASI Python interpreter
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dock-wasm-cache
          # The key is the SHA-256 pinned in cli/wasm.py: a new pin is a new cache entry. The tests check
          # the hash of the cached zip before they use it either way.
          key: wasm-python-b8a63559c56760bbdc310dedb74fd69d10bcbafae26b705bea0ad353ad256888
      - run: make test
        env:
          DOCK_TEST_WASM_CACHE: ${{ runner.temp }}/dock-wasm-cache
