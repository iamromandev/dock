[package]
name = "image-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "image_plugin"
path = "src/lib.rs"

[[bin]]
name = "image"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
