id = "dev.dock.llm"
version = "0.1.0"
api_version = "1"
description = "Language model provider: built-in toy model, or any OpenAI-compatible server"

[run]
any = { cmd = "python3", args = ["main.py"], requires = ["python3"] }
container = { cmd = "python3", args = ["/plugin/main.py"] }

# No commands of its own: other plugins call it through the host.
[capabilities]
provides = ["llm"]
permissions = ["network"]
# Isolated, the container sees only these host variables (by name; values never go on the command line).
# A model server on the host's localhost is not reachable from a container: use host.docker.internal.
env = ["DOCK_LLM_BASE_URL", "DOCK_LLM_MODEL", "DOCK_LLM_API_KEY"]

[lifecycle]
provision = true   # load the model / open the client; unprovision releases it
