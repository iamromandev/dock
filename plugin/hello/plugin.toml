id = "dev.dock.hello"
version = "0.1.0"
api_version = "1"
description = "Python plugin; one plugin, two commands"

[run]
container = { cmd = "python3", args = ["/plugin/main.py"] }

[[commands]]
name = "hello"
summary = "Greet someone: hello [name]"
inputs = [{ name = "name", type = "string" }]

[[commands]]
name = "count"
summary = "Count with a progress bar: count [n]"
inputs = [{ name = "n", type = "int", default = 10 }]
