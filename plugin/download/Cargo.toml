[package]
name = "download"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "download"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
fd-lock = "4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "time", "sync"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
