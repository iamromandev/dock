id = "dev.dock.download"
version = "0.1.0"
api_version = "1"
description = "Download a URL (http, https, file) with progress"

# Native: one prebuilt binary per OS/arch (`make dist` builds them all).
# Container: with [isolation] on, the Dockerfile builds the binary into an image.
[run]
linux-x86_64   = { cmd = "bin/download-linux-x86_64" }
linux-arm64    = { cmd = "bin/download-linux-arm64" }
darwin-x86_64  = { cmd = "bin/download-darwin-x86_64" }
darwin-arm64   = { cmd = "bin/download-darwin-arm64" }
windows-x86_64 = { cmd = "bin/download-windows-x86_64.exe" }
container      = { cmd = "/plugin/download" }

[[commands]]
name = "download"
summary = "Download a URL: download <url> [-o file]"

[capabilities]
permissions = ["network", "fs:write:cwd"]
